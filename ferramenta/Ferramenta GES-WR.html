<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferramenta GES-WR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plano visual: preto e grafite como estrutura, laranja #BE6A14 só onde há ação ou estado.
   Layout: barra superior preta, trilha lateral grafite, área de trabalho com régua de critérios à direita. */
:root{
  --c-orange:#BE6A14;--c-black:#000000;--c-graphite:#303032;--c-white:#FFFFFF;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#FFFFFF;--surface:#F6F5F4;--surface-2:#EAE8E6;--line:#D5D2CF;--ink:#303032;--ink-2:#5B5A5D;
  --accent:#BE6A14;--accent-ink:#8F4C0A;--on-accent:#000000;--accent-soft:#F7E8D8;
  --field:#FFFFFF;--side-bg:#303032;--side-ink:#FFFFFF;--side-mute:#B9B7B5;--side-line:#4A4A4D;
  --top-bg:#000000;--top-ink:#FFFFFF;
  --ok:#2C7A4B;--bad:#B3261E;--ok-soft:#E1F1E7;--bad-soft:#F8E1DE;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--surface:#161617;--surface-2:#303032;--line:#3A3A3D;--ink:#FFFFFF;--ink-2:#B7B5B3;
    --accent-ink:#E08A2E;--accent-soft:#2A1B0C;--field:#0C0C0D;--side-bg:#161617;--side-line:#303032;
    --ok:#5FC48A;--bad:#FF7A70;--ok-soft:#10261A;--bad-soft:#2E1513;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#161617;--surface-2:#303032;--line:#3A3A3D;--ink:#FFFFFF;--ink-2:#B7B5B3;
  --accent-ink:#E08A2E;--accent-soft:#2A1B0C;--field:#0C0C0D;--side-bg:#161617;--side-line:#303032;
  --ok:#5FC48A;--bad:#FF7A70;--ok-soft:#10261A;--bad-soft:#2E1513;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:38px;line-height:1.05;text-transform:uppercase}
h2{font-size:23px;line-height:1.15}
h3{font-size:17px;line-height:1.2}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* estrutura */
.app{display:grid;grid-template-columns:276px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);height:100%}
.top{grid-column:1/3;background:var(--top-bg);color:var(--top-ink);display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:2px solid var(--accent);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font:700 28px/1 var(--f-display);letter-spacing:.04em}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{font-size:12.5px;color:#C9C7C5}
.menu-btn{display:none}
.top .meta{display:flex;align-items:center;gap:14px;font-size:13px;color:#C9C7C5}
.top .meta strong{color:#fff;font-weight:600}
.saved{font-size:12px;color:#9C9A98;text-align:right}
.side{background:var(--side-bg);color:var(--side-ink);overflow:auto;padding:16px 0 28px}
.main{overflow:auto;padding:30px clamp(16px,3vw,44px) 90px;scroll-behavior:smooth}

/* trilha lateral */
.side a,.side .dis{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 16px;color:var(--side-ink);text-decoration:none;font-size:14px;border-left:3px solid transparent}
.side a:hover{background:rgba(255,255,255,.06)}
.side a.on{background:rgba(190,106,20,.18);border-left-color:var(--accent);font-weight:600}
.side .dis{color:#8E8C8A;cursor:default}
.side .n{font:500 11.5px var(--f-mono);color:var(--side-mute);width:20px}
.side .st{margin-left:auto;width:16px;height:16px;flex:none}
.side .grp{margin:14px 18px 4px;font:600 11.5px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--side-mute);display:flex;align-items:center;gap:8px}
.side .grp .bar{flex:1;height:3px;background:var(--side-line);border-radius:2px;overflow:hidden}
.side .grp .bar i{display:block;height:100%;background:var(--accent)}
.side .rev{margin:6px 18px;padding:5px 10px;border:1px dashed var(--side-line);border-radius:6px;font-size:12px;color:var(--side-mute);display:flex;gap:8px;align-items:center}
.side .rev.ready{border-style:solid;border-color:var(--accent);color:#fff}
.side .fut{margin:18px 18px 0;font-size:12px;color:#8E8C8A;line-height:1.45}
.side .cred{position:sticky;bottom:-28px;margin:22px 0 -28px;padding:12px 18px 14px;background:var(--side-bg);border-top:1px solid var(--side-line);font-size:11.5px;line-height:1.5;color:var(--side-mute)}
.side .cred b{display:block;color:var(--side-ink);font-weight:600;font-size:12px}
.side .cred a{display:inline;padding:0;border:0;background:none;color:inherit;font:inherit;text-decoration:none}
.side .cred a:hover,.side .cred a:focus-visible{background:none;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}

/* cabeçalho do módulo e régua */
.mh{margin-bottom:22px;max-width:1180px}
.crumb{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px}
.q{margin-top:8px;font-size:17px;color:var(--ink-2);max-width:62ch}
.origin{margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:28px;align-items:start;max-width:1280px}
.work{display:flex;flex-direction:column;gap:20px;min-width:0}
.rail{position:sticky;top:0;display:flex;flex-direction:column;gap:12px}
.band{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden}
.band>summary{list-style:none;cursor:pointer;padding:11px 14px;font:600 13px var(--f-body);letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.band>summary::-webkit-details-marker{display:none}
.band>summary::after{content:"+";margin-left:auto;font:500 18px var(--f-mono);color:var(--ink-2)}
.band[open]>summary::after{content:"–"}
.band .bd{padding:0 14px 14px;font-size:14px}
.band ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.band.crit{border-color:var(--accent);background:var(--bg)}
.crit .row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.crit .row:first-child{border-top:0}
.crit .row .tx{flex:1}
.crit .row small{display:block;color:var(--ink-2);font-size:12.5px}
.mark{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-mono);border:2px solid var(--line);color:var(--ink-2)}
.mark.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.mark.no{border-color:var(--accent);color:var(--accent-ink)}
.crit a{color:var(--accent-ink);font-size:12.5px;cursor:pointer;text-decoration:underline}
.example{font-size:14px;background:var(--accent-soft);border-radius:6px;padding:10px 12px;color:var(--ink)}

/* componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card>header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card>header h2{margin-right:auto}
.sub{font-size:13.5px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.top .btn{background:#1B1B1C;border-color:#3A3A3D;color:#fff;padding:6px 10px;font-size:13px;white-space:nowrap}
.top .btn:hover{border-color:var(--accent)}
.in,.sl,.ta{width:100%;background:var(--field);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:14px;min-width:0}
.in:focus,.sl:focus,.ta:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.ta{resize:vertical;min-height:72px;line-height:1.45}
.in.n{font-family:var(--f-mono);text-align:right}
.in.id{font-family:var(--f-mono);font-size:13px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.lbl{font:600 12.5px var(--f-body);color:var(--ink-2)}
.hint{font-size:12.5px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.rows{display:flex;flex-direction:column;gap:8px}
.rw{display:grid;gap:10px;align-items:center;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:9px}
.rw.warn{border-left:4px solid var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;padding:7px 13px;cursor:pointer;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font:500 12px var(--f-mono);background:var(--surface-2);color:var(--ink)}
.tag.acc{background:var(--accent);color:var(--on-accent)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--accent-soft);color:var(--accent-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13px}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--ink-2);font-size:15px;line-height:1;padding:0 4px}
.chip button:hover{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-2);font-size:14px;text-align:center}
.note{font-size:13px;color:var(--ink-2);border-left:3px solid var(--accent);padding:4px 0 4px 10px}
.bar{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.ok i{background:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 12.5px var(--f-body);color:var(--ink-2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}

/* roteiro */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;background:var(--top-bg);color:var(--top-ink);border-radius:14px;padding:22px 26px;border:1px solid var(--accent)}
.hero h2{font-size:27px;color:#fff}
.hero p{color:#CFCDCB;margin-top:4px;max-width:60ch}
.hero .kick{font:500 12px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 24px var(--f-display);color:#fff}
.track{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;position:relative}
.node:hover{border-color:var(--accent)}
.node .k{font:500 12px var(--f-mono);color:var(--accent-ink)}
.node h3{font-size:19px}
.node p{font-size:13.5px;color:var(--ink-2)}
.node.done{border-color:var(--ok)}
.node.rev{background:transparent;border-style:dashed}
.node.rev.ready{border-style:solid;border-color:var(--accent)}
.node.fut{opacity:.55;cursor:default}
.node.fut:hover{border-color:var(--line)}
.node .cnt{font:500 12px var(--f-mono);color:var(--ink-2)}

/* conops */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px;display:flex;flex-direction:column;gap:9px;min-width:0}
.col.gap{border:1px dashed var(--accent)}
.col>.ch{display:flex;gap:6px;align-items:center}
.col>.ch .in{font-weight:600}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px;display:flex;flex-direction:column;gap:7px}
.sc .id{font:500 11.5px var(--f-mono);color:var(--ink-2)}

/* mestre-detalhe */
.md{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.list{display:flex;flex-direction:column;gap:6px;max-height:620px;overflow:auto}
.li{display:flex;flex-direction:column;gap:3px;text-align:left;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;border-left:4px solid var(--line)}
.li:hover{border-color:var(--accent)}
.li.sel{border-color:var(--accent);background:var(--accent-soft)}
.li.bq{border-left-color:var(--bad)}
.li.al{border-left-color:var(--accent)}
.li.gd{border-left-color:var(--ok)}
.li .t{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li .m{display:flex;gap:6px;align-items:center;font:500 11.5px var(--f-mono);color:var(--ink-2)}
.diag{display:flex;flex-direction:column;gap:6px}
.dg{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px}
.dg code{font:500 12px var(--f-mono);padding:1px 6px;background:var(--surface-2);border-radius:5px}
.dg small{display:block;color:var(--ink-2);font-size:12px}
mark{background:var(--accent);color:var(--on-accent);border-radius:3px;padding:0 2px}
.rd{padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:14px}

/* matrizes */
.mx{border-collapse:separate;border-spacing:3px;width:auto}
.mx th,.mx td{border:0;padding:0}
.mx thead th{font-size:11.5px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600;padding:4px 6px;max-width:110px;vertical-align:bottom;text-align:center}
.mx tbody th{text-align:left;padding:4px 10px 4px 0;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);max-width:230px;font-weight:500}
.cell{width:46px;height:40px;border-radius:7px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;font:600 13px var(--f-mono);padding:0}
.cell:hover{border-color:var(--accent)}
.cell.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cell.diag{background:var(--graphite,#303032);background:var(--c-graphite);color:#fff;border-color:var(--c-graphite);cursor:default;font-size:11px;width:auto;min-width:46px;padding:0 6px}
.cell.sel{outline:2px solid var(--accent);outline-offset:1px}
.cell.has{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.cell.has.sel{background:var(--accent);color:var(--on-accent)}
.cell.void{background:transparent;border-style:dashed;cursor:default}
.rowwarn{color:var(--bad);font:600 12px var(--f-mono)}

/* painel e orçamentos */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tile .code{font:600 12px var(--f-mono);color:var(--accent-ink)}
.tile .val{font:700 36px/1 var(--f-display)}
.tile .val small{font:500 13px var(--f-body);color:var(--ink-2);margin-left:6px}
.tile .def{font-size:13px;color:var(--ink-2)}
.delta{font:600 12px var(--f-mono)}
.delta.up{color:var(--ok)}.delta.dn{color:var(--bad)}.delta.eq{color:var(--ink-2)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.kpi .l{font:600 12.5px var(--f-body);color:var(--ink-2)}
.kpi .v{font:600 28px/1.1 var(--f-display);margin-top:3px}
.kpi .v small{font:500 12.5px var(--f-body);color:var(--ink-2)}
.kpi.ok{border-color:var(--ok)}.kpi.bad{border-color:var(--bad)}.kpi.warn{border-color:var(--accent)}
.verdict{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.verdict.ok{border-color:var(--ok);background:var(--ok-soft)}.verdict.bad{border-color:var(--bad);background:var(--bad-soft)}.verdict.warn{border-color:var(--accent);background:var(--accent-soft)}
.verdict b{font:600 18px var(--f-display);letter-spacing:.02em}
.heat td{text-align:center;font:500 13px var(--f-mono);padding:7px 8px}
.heat td.p{background:var(--ok-soft);color:var(--ok)}.heat td.n{background:var(--bad-soft);color:var(--bad)}
.chart text{fill:var(--ink-2);font:12.5px var(--f-mono)}
.chart .ax{stroke:var(--line)}
.chart .ln{stroke:var(--accent);stroke-width:2.5;fill:none}
.chart .pm{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;font-weight:500;color:var(--ink-2)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
.ph{display:flex;gap:4px;flex-wrap:wrap}
.ph button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 6px;font:500 11px var(--f-mono);cursor:pointer;color:var(--ink-2)}
.ph button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* modal e toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--bg);color:var(--ink);border:1px solid var(--accent);border-radius:14px;padding:22px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.dlg .ac{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--c-black);color:#fff;border:1px solid var(--accent);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:1100px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;order:-1}
  .md{grid-template-columns:1fr}
  .list{max-height:260px}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .top{grid-column:1}
  .menu-btn{display:inline-flex}
  .side{position:fixed;left:0;top:0;bottom:0;width:276px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .hero{grid-template-columns:1fr}
  h1{font-size:30px}
  .brand span{display:none}
  .saved{display:none}
  .top .meta{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* painéis de contexto */
.ctx{grid-column:1/3;display:flex;gap:10px 22px;flex-wrap:wrap;align-items:stretch;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.cp{display:flex;flex-direction:column;gap:5px;min-width:0}
.cp-t{font:600 12px var(--f-body);color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
.cp-b{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctab{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:14px}
.ctab:hover{border-color:var(--accent)}
.ctab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.ctab-w{display:inline-flex;align-items:center;gap:2px}
.ctab-x{border:0;background:transparent;color:var(--ink-2);cursor:pointer;font-size:12px;padding:4px 5px;border-radius:5px}
.ctab-x:hover{color:var(--bad)}
.addtab{display:inline-flex;align-items:stretch;border:1px dashed var(--accent);border-radius:8px;overflow:hidden;background:var(--bg)}
.addtab input{border:0;background:transparent;padding:6px 10px;width:150px;font-size:14px;min-width:0}
.addtab input:focus{outline:none;background:var(--accent-soft)}
.addtab input::placeholder{color:var(--ink-2)}
.addtab button{border:0;border-left:1px dashed var(--accent);background:transparent;color:var(--accent-ink);cursor:pointer;padding:0 11px;font:600 17px var(--f-mono)}
.addtab button:hover{background:var(--accent);color:var(--on-accent)}
@media (max-width:820px){.ctx{grid-column:1;padding:10px 16px}.addtab input{width:120px}}

.node.off{opacity:.78;border-style:dotted}
.vc{display:flex;flex-direction:column;gap:10px}

.logo-m{width:40px;height:40px;object-fit:contain;display:block;flex:none}
.logo-plate{display:inline-block;background:#fff;border-radius:10px;padding:8px 14px;margin:0 0 12px;line-height:0}
.logo-plate img{height:58px;width:auto;display:block}
@media (max-width:820px){.logo-m{width:32px;height:32px}}

@media (max-width:1560px){.brand span{display:none}}

</style>

const phMin=p=>num(S.en.jogo==='longo'?p.longo:p.medio);

function pmed(ov){let tot=0,skipped=0,prem=0;S.en.cargas.forEach(l=>{const i=loadInfo(l,ov);if(i.counted){tot+=i.P;if(l.origem==='premissa')prem++}else skipped++});return {tot,skipped,prem}}

  const mg=margens();const worst=mg.length?mg.reduce((a,b)=>b.M<a.M?b:a):null;

  M.M8=mk('M8','Decisões justificadas',decs.filter(decOk).length,decs.length,'Decisões com duas ou mais alternativas, escolha, justificativa e fonte. Decisões ilustrativas não contam.');
  const C=criteria(),ph=FASES.filter(counted).map(f=>{const p=faseProg(f.k,C);return {k:f.k,n:f.n,nome:f.nome,ok:p.ok,tot:p.tot,v:p.tot?p.ok/p.tot:0}});
  M.M9={id:'M9',nome:'Maturidade por fase',v:ph.reduce((a,b)=>a+b.v,0)/ph.length,ph,def:`Fração dos critérios de pronto atendidos em cada fase (0 a ${ate()}). O valor geral é a média das fases.`};
  return M;
}
function overall(){const C=criteria();let ok=0,tot=0;FASES.forEach(f=>{if(!counted(f))return;const p=faseProg(f.k,C);ok+=p.ok;tot+=p.tot});return {ok,tot,v:tot?ok/tot:0}}

      <p><b>GES-WR</b><br>A ferramenta conduz ConOps, requisitos e arquitetura de hardware até a Fase 4, a partir das normas ISO/IEC/IEEE 15288, 29148, 42010 e 24748-2.</p>
      <p><b>Dados</b><br>Os dados do Time B vêm dos documentos do projeto. Valores sem fonte permanecem em branco e marcados como pendentes. Os percentuais de fase vêm do painel da Tigers (Divisão B da RoboCup 2025) e valem apenas como ordem de grandeza, o Time B não participou do torneio.</p>
      <p><b>Definições das regras de redação</b><br>R2 identifica no texto cada termo do dicionário como palavra inteira, sem diferenciar acento nem maiúscula. R1 e R4 a R8 bloqueiam, R2 e R3 geram alerta. R3 é uma heurística. Estas definições precisam estar na regra de pontuação antes da medição de M1 a M9.</p>

    <span class="t">${esc(r.texto||'(sem texto)')}</span></button>`}).join('');
};
function hlText(t){
  const n=norm(t);if(n.length!==t.length)return esc(t);
  const ranges=[];
  S.dic.forEach(w=>{const k=norm(w).trim();if(!k)return;const re=new RegExp('(^|[^a-z0-9])('+k.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')+')(?=$|[^a-z0-9])','g');let m;while((m=re.exec(n))){const a=m.index+m[1].length;ranges.push([a,a+m[2].length]);if(m[2].length===0)re.lastIndex++}});
  ranges.sort((a,b)=>a[0]-b[0]);let out='',p=0;
  ranges.forEach(([a,b])=>{if(a<p)return;out+=esc(t.slice(p,a))+'<mark>'+esc(t.slice(a,b))+'</mark>';p=b});
  return out+esc(t.slice(p));
}

/* ---------- Decisões ---------- */
const decIdx=()=>{let i=S.decs.findIndex(d=>d.id===UI.decSel);if(i<0&&S.decs.length){i=0;UI.decSel=S.decs[0].id}return i};
function decScores(d){
  const W=d.crit.map(c=>num(c.w));
  return d.alts.map(a=>{let sw=0,s=0,miss=0;d.crit.forEach((c,k)=>{const w=W[k],v=num(a.s[k]);if(Number.isFinite(w)&&Number.isFinite(v)){sw+=w;s+=w*v}else miss++});return {n:a.n,tot:sw>0?s/sw:NaN,miss}});
}
LIVE.decmx=()=>{
  const i=decIdx();if(i<0)return '';const d=S.decs[i],sc=decScores(d);
  const best=sc.filter(x=>Number.isFinite(x.tot)&&x.miss===0).reduce((a,b)=>!a||b.tot>a.tot?b:a,null);

function chartF(e){
  const W=520,H=230,L=48,R=14,T=14,B=34,x0=0.5,x1=1.0;
  const ymax=Math.max(10,...[e.P1*1.05,e.P*1.25].filter(Number.isFinite)),X=f=>L+(f-x0)/(x1-x0)*(W-L-R),Y=p=>H-B-(p/ymax)*(H-T-B);
  const yt=[0,.25,.5,.75,1].map(k=>Math.round(ymax*k/5)*5||0);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Potência admissível em função de f, com a potência média das cargas" style="width:100%;max-width:560px;height:auto">`;
  [...new Set(yt)].forEach(v=>{s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`});
  [0.5,0.6,0.7,0.8,0.9,1.0].forEach(f=>{s+=`<line class="ax" x1="${X(f)}" x2="${X(f)}" y1="${H-B}" y2="${H-B+4}"/><text x="${X(f)}" y="${H-B+17}" text-anchor="middle">${fmt(f,1)}</text>`});
  s+=`<text x="${(L+W-R)/2}" y="${H-3}" text-anchor="middle">f (fração de descarga permitida)</text><text x="12" y="${T+4}">W</text>`;
  if(Number.isFinite(e.P1)){s+=`<polyline class="ln" points="${X(x0)},${Y(e.P1*x0)} ${X(x1)},${Y(e.P1*x1)}"/>`;
  s+=`<text x="${X(0.97)}" y="${Y(e.P1*0.97)-8}" text-anchor="end" style="fill:var(--accent-ink)">P admissível</text>`}
  if(e.P>0){s+=`<line class="pm" x1="${L}" x2="${W-R}" y1="${Y(e.P)}" y2="${Y(e.P)}"/><text x="${L+4}" y="${Y(e.P)-6}">P_med = ${fmt(e.P,2)} W${e.skipped?' (parcial)':''}</text>`;
    if(e.fmin>=x0&&e.fmin<=x1)s+=`<circle cx="${X(e.fmin)}" cy="${Y(e.P)}" r="5" fill="var(--accent)"/><text x="${X(e.fmin)}" y="${Y(e.P)+18}" text-anchor="middle">f mín = ${fmt(e.fmin,2)}</text>`;}
  return s+'</svg>';
}
LIVE.enres=()=>{

  else{cls='warn';v=`<b>Resultado parcial.</b> ${e.skipped?`${e.skipped} carga${e.skipped>1?'s':''} fora da soma (pendente ou incompleta). `:''}${Number.isFinite(e.f)?'':'f não informado. '}${b.for==='pendente'&&Number.isFinite(e.f)?'f está como pendente. ':''}O consumo mostrado é um limite inferior.`}
  const sc=Object.keys(SCEN),fs=[0.6,0.7,0.8,0.9,1.0],part=e.skipped>0;

  const etas=[0.7,0.8,0.9,1.0];
  const heatB=Number.isFinite(e.f)?`<table class="heat"><thead><tr><th>η motores</th>${sc.map(k=>`<th style="text-align:center">D ${SCEN[k].nome.toLowerCase()}</th>`).join('')}</tr></thead><tbody>${etas.map(et=>`<tr><th>${fmt(et,1)}</th>${sc.map(k=>{const M=marginFor({fases:SCEN[k].fases,eta:et},e.f);return `<td class="${Number.isFinite(M)&&!part?(M>=0?'p':'n'):''}">${sgn(M,1)}</td>`}).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">Informe f na tabela da bateria para ver esta tabela.</div>';
  return `<div class="verdict ${cls}"><span class="mark ${cls==='ok'?'ok':'no'}" aria-hidden="true">${cls==='ok'?'✓':cls==='bad'?'✕':'!'}</span><span>${v}</span></div>
  <div class="big" style="margin:14px 0">
   <div class="kpi"><div class="l">P_med (cargas somadas)</div><div class="v mono">${fmt(e.P,2)} <small>W</small></div></div>
   <div class="kpi"><div class="l">P admissível com f = 1</div><div class="v mono">${fmt(e.P1,2)} <small>W · ${fmt(e.Wh,2)} Wh ÷ ${fmt(e.Th,4)} h</small></div></div>
   <div class="kpi ${Number.isFinite(e.f)?'':'warn'}"><div class="l">f mínimo para o t_req</div><div class="v mono">${fmt(e.fmin,3)} <small>${e.skipped?'(parcial)':''}</small></div></div>
   <div class="kpi"><div class="l">t_op com f informado</div><div class="v mono">${Number.isFinite(e.top)?fmt(e.top,1):'sem f'} <small>${Number.isFinite(e.top)?'min':''}</small></div></div></div>
  <h3 style="margin-bottom:6px">Potência admissível em função de f</h3>${chartF(e)}
  <h3 style="margin:16px 0 6px">Margem de autonomia por f e cenário de D</h3>${heatA}<p class="sub" style="margin-top:6px">${part?'Sem cor: o consumo ainda é parcial, então a margem não vale como resultado. ':'Verde: atende. Vermelho: não atende. '}Os valores de f são só varredura, não dado da bateria.</p>
  <h3 style="margin:16px 0 6px">Margem por η dos motores, com o f informado</h3>${heatB}`;

/* ---------- Painel ---------- */
const mval=(m)=>m.v==null?'—':m.raw?sgn(m.v,1):pct(m.v);
function cmpDelta(a,b){if(a==null||b==null)return null;return b-a}
LIVE.painel=()=>{
  const M=metrics(),snap=S.snapshot;let up=0,eq=0,dn=0,tot=0;
  const tile=m=>{
    let dlt='',bef='';
    if(snap&&snap.m[m.id]!==undefined){const a=snap.m[m.id],d=cmpDelta(a,m.v);bef=`<span class="sub">antes: ${m.raw?(a==null?'—':sgn(a,1)):(a==null?'—':pct(a))}</span>`;
      if(d!=null){tot++;if(d>0.0005){up++;dlt=`<span class="delta up">▲ ${m.raw?sgn(d,1):'+'+fmt(d*100,0)+' p.p.'}</span>`}else if(d<-0.0005){dn++;dlt=`<span class="delta dn">▼ ${m.raw?sgn(d,1):fmt(d*100,0)+' p.p.'}</span>`}else{eq++;dlt='<span class="delta eq">= sem mudança</span>'}}}
    let extra='';
    if(m.id==='M9')extra=`<div class="rows" style="gap:6px">${m.ph.map(p=>`<div style="display:grid;grid-template-columns:90px 1fr 46px;gap:8px;align-items:center;font-size:12.5px"><span>Fase ${p.n}</span><div class="bar ${p.ok===p.tot?'ok':''}"><i style="width:${p.v*100}%"></i></div><span class="mono">${p.ok}/${p.tot}</span></div>`).join('')}</div>`;
    else if(m.id==='M7')extra=m.all.length?`<div class="rows" style="gap:4px;font-size:12.5px">${m.all.map(x=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(x.n)}${x.complete?'':' <span class="tag warn">parcial</span>'}</span><span class="mono">${sgn(x.M,1)}</span></div>`).join('')}</div>`:'<div class="sub">Nenhum orçamento com valor calculado.</div>';
    else if(m.id==='M4')extra=`<div class="sub">Vidas ${m.parts.vidas[0]}/${m.parts.vidas[1]} · modos ${m.parts.modos[0]}/${m.parts.modos[1]} · cenários citados ${m.parts.cen[0]}/${m.parts.cen[1]}</div>`;
    else extra=`<div class="sub mono">${m.num} de ${m.den}</div>`;
    const v=m.v==null?0:m.raw?Math.max(0,Math.min(1,m.v)):m.v;
    return `<div class="tile"><span class="code">${m.id}</span><div class="val">${mval(m)}</div><strong style="font-size:15px">${esc(m.nome)}</strong>${m.id==='M7'?'':`<div class="bar ${v>=1?'ok':''}"><i style="width:${v*100}%"></i></div>`}${extra}${dlt||bef?`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${dlt}${bef}</div>`:''}<p class="def">${esc(m.def)}</p></div>`;
  };
  const tiles=Object.values(M).map(tile).join('');
  const C=criteria(),pend=[];FASES.forEach(f=>{if(!counted(f))return;C[f.k].forEach(c=>{if(!c.ok)pend.push({f,c})})});
  const cmp=snap?`<div class="verdict ${dn?'bad':up?'ok':'warn'}" style="margin-bottom:12px"><span><b>Antes × depois:</b> ${up} métrica${up===1?'':'s'} melhor${up===1?'':'es'}, ${eq} sem mudança, ${dn} pior${dn===1?'':'es'} (de ${tot} comparáveis). Antes salvo em ${esc(snap.data)}${snap.rot?' · '+esc(snap.rot):''}. Critério 2: melhora em todas as métricas.</span></div>`:'';
  return `${cmp}<div class="tiles">${tiles}</div>
  <section class="card" style="margin-top:20px"><header><h2>Pendências</h2><span class="sub">${pend.length} critério${pend.length===1?'':'s'} aberto${pend.length===1?'':'s'}</span></header>
  <div class="rows">${pend.map(p=>`<div class="rw" style="grid-template-columns:auto minmax(0,1fr) auto"><span class="tag">Fase ${p.f.n}</span><span>${esc(p.c.t)}${p.c.det?` <span class="sub">· ${esc(p.c.det)}</span>`:''}</span><button type="button" class="btn sm" data-act="go" data-m="${p.c.go}">Abrir</button></div>`).join('')||'<div class="empty">Sem pendências nas Fases 0 a 4.</div>'}</div></section>`;
};
function vPainel(){
  return `<section class="card"><header><h2>Antes e depois</h2></header>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><span class="lbl" style="margin:0">Escopo:</span>${seg('meta.ate',[['4','Fases 0 a 4'],['6','Fases 0 a 6']],{label:'Escopo'})}</div>

      <button type="button" class="btn pri" data-act="snap">Salvar estado atual como "antes"</button>

/* ---------- Revisões (módulo 11) ---------- */
const REV_DEC=[['','Pendente'],['aprovada','Aprovada'],['ressalvas','Aprovada com ressalvas'],['reprovada','Reprovada']];
function vRevisoes(){
  const C=criteria();
  const cards=FASES.filter(f=>f.rev).map(f=>{
    const ready=revReady(f,C),v=revOf(f.k),P=`revs.${f.k}`;
    const pend=[];f.dep.forEach(k=>C[k].forEach(c=>{if(!c.ok)pend.push({k,c})}));

/* ---------- leitura ---------- */
XL.read=async buf=>{
  const z=await XL.unzip(buf);
  if(!z['xl/workbook.xml'])throw new Error('Não encontrei o conteúdo da planilha (xl/workbook.xml).');
  const P=s=>new DOMParser().parseFromString(s,'application/xml');
  const tag=(d,n)=>Array.from(d.getElementsByTagNameNS('*',n));
  const wb=P(z['xl/workbook.xml']),rels=z['xl/_rels/workbook.xml.rels']?P(z['xl/_rels/workbook.xml.rels']):null;
  const relMap={};if(rels)tag(rels,'Relationship').forEach(r=>{relMap[r.getAttribute('Id')]=r.getAttribute('Target')});
  const ss=[];if(z['xl/sharedStrings.xml'])tag(P(z['xl/sharedStrings.xml']),'si').forEach(si=>{let t='';Array.from(si.childNodes).forEach(ch=>{const ln=ch.localName;if(ln==='t')t+=ch.textContent;else if(ln==='r')tag(ch,'t').forEach(x=>{t+=x.textContent})});ss.push(t)});
  const dateXf=[];
  if(z['xl/styles.xml']){
    const sd=P(z['xl/styles.xml']),custom={};tag(sd,'numFmt').forEach(n=>{custom[n.getAttribute('numFmtId')]=n.getAttribute('formatCode')||''});
    const xfs=tag(sd,'cellXfs')[0];
    if(xfs)Array.from(xfs.childNodes).filter(n=>n.localName==='xf').forEach((xf,i)=>{
      const id=+xf.getAttribute('numFmtId');let d=(id>=14&&id<=22)||(id>=27&&id<=36)||(id>=45&&id<=47)||(id>=50&&id<=58);
      if(custom[id]!==undefined){const c=custom[id].replace(/"[^"]*"/g,'').replace(/\\./g,'').replace(/\[[^\]]*\]/g,'');d=/[dmy]/i.test(c)&&!/general/i.test(c)}
      dateXf[i]=d;
    });
  }
  const pad=n=>String(n).padStart(2,'0');
  const serial=n=>{const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);return pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1)+'/'+d.getUTCFullYear()};
  const sheets=[];
  for(const s of tag(wb,'sheet')){
    const rid=s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||s.getAttribute('r:id');
    let tg=relMap[rid]||'';tg=tg.replace(/^\/?(xl\/)?/,'');const path='xl/'+tg;
    if(!z[path])continue;
    const doc=P(z[path]),rows=[];
    tag(doc,'row').forEach(row=>{
      const ri=(+row.getAttribute('r'))-1;const arr=[];
      tag(row,'c').forEach(c=>{
        const ref=c.getAttribute('r')||'',ci=ref?XL.colIdx(ref):arr.length,t=c.getAttribute('t'),st=+c.getAttribute('s')||0;
        const vn=tag(c,'v')[0],raw=vn?vn.textContent:'';let v='';
        if(t==='s')v=ss[+raw]!==undefined?ss[+raw]:'';
        else if(t==='inlineStr'){v=tag(c,'t').map(x=>x.textContent).join('')}
        else if(t==='str')v=raw;
        else if(t==='b')v=raw==='1';
        else if(t==='e')v='';
        else if(raw!==''){const nv=Number(raw);v=Number.isFinite(nv)?(dateXf[st]?serial(nv):nv):raw}
        arr[ci]=v;
      });
      for(let i=0;i<arr.length;i++)if(arr[i]===undefined)arr[i]='';
      rows[ri]=arr;
    });
    for(let i=0;i<rows.length;i++)if(!rows[i])rows[i]=[];
    sheets.push({name:s.getAttribute('name'),rows});
  }
  return sheets;
};

  const idx={};defs.forEach(d=>[d.p,d.c,...(d.al||[])].forEach(n=>{idx[xn(n)]=d}));

function xlsxBuild(){
  const tabs=TABLES(),ctx={pos:{}},sheets={};
  const sh=n=>sheets[n]||(sheets[n]=new XSheet(n,[]));
  const widthOf=(s,i,w)=>{s.w[i]=Math.max(s.w[i]||10,w||16)};
  const cn=ctxName();
  SHEET_ORDER.forEach(n=>{if(n==='Versão')return;const s=sh(n);s.put(0,0,'GES-WR · '+(SHEET_LABEL[n]||n),ST.tit);s.put(1,0,cn+'. Células cinza são calculadas e ignoradas na importação.',ST.note);s.next=3});
  const cells=(def)=>def.cols;
  tabs.forEach(def=>{
    const s=sh(def.sheet);let r=s.next;const cols=def.cols;
    cols.forEach((c,i)=>s.put(r,i,i===0?def.title:'',ST.sec));r++;
    cols.forEach((c,i)=>{s.put(r,i,c.h,ST.hdr);widthOf(s,i,c.w||(c.h.length+4))});const hdr=r;r++;
    let objs=def.get(S);const n=objs.length;if(!n)objs=[{}];
    const first=r;
    ctx.pos[def.id]={hdr,first,last:first+objs.length-1,n};
    objs.forEach((o,ri)=>{
      cols.forEach((c,i)=>{
        const R=r+1;
        if(c.fx||def.id==='treq'&&c.k==='v'||def.id==='res'&&c.k==='v'){return}
        let v=o[c.k],st=c.ro?ST.dtx:ST.txt;
        if(c.m){const hit=c.m.find(x=>x[0]===v);v=hit?hit[1]:(v||'')}
        else if(c.t==='b')v=v?'Sim':'';
        else if(c.t==='l')v=Array.isArray(v)?v.join(', '):(v||'');
        else if(c.t==='ph')v=Object.keys(v||{}).filter(k=>v[k]).join(', ');
        else if(c.t==='n'&&v!==''&&v!=null&&xIsNum(v)){s.put(r,i,xToNum(v),c.ro?ST.dn2:ST.num);return}
        if(c.ro&&def.id==='reqs'&&c.k==='alertas')v=o.alertas;
        s.put(r,i,v==null?'':String(v),st);
      });
      r++;
    });
    /* validações de lista */
    cols.forEach((c,i)=>{const L=c.m?c.m.map(x=>x[1]):c.en;if(L&&!c.ro)s.dv.push({sq:XL.col(i)+(first+1)+':'+XL.col(i)+(first+n+30),list:L.join(',')})});
    if(def.dvAt)Object.keys(def.dvAt).forEach(k=>{const i=cols.findIndex(c=>c.k===k);s.dv.push({sq:XL.col(i)+(first+1),list:def.dvAt[k]})});
    s.next=r+1;
  });
  /* fórmulas do módulo 9 */
  const s9=sheets['09_Orçamentos'],P=ctx.pos,A=(id,c,k)=>'$'+XL.col(c)+'$'+(P[id].first+1+(k||0));

/* ---------- importação ---------- */
function xlsxParse(sheets){
  const tabs=TABLES(),rep={found:[],missing:[],warn:[],skipped:0,own:false};
  const strip=n=>xn(n).replace(/^\d+[a-z]?\s+/,'');
  const byName=n=>sheets.find(s=>s.name===n)||sheets.find(s=>strip(s.name)===strip(n));
  const ver=sheets.find(s=>xn(s.name)==='versao');
  if(ver)rep.own=ver.rows.some(r=>r&&r.some(c=>String(c)===XFORMAT));
  const claimed={};const result=[];
  const matchRow=(row,def)=>{const map={};let hits=0;(row||[]).forEach((cell,ci)=>{const nn=xn(cell);if(!nn)return;for(const c of def.cols){if(c.ro||map[c.k]!==undefined)continue;if([c.h,...(c.al||[])].map(xn).includes(nn)){map[c.k]=ci;hits++;break}}});return {map,hits}};
  const rwsOf=def=>{const first=byName(def.sheet);return [first,...sheets.filter(s=>s!==first)].filter(Boolean)};
  tabs.forEach(def=>{
    if(def.ro&&!def.set)return;
    const need=def.cols.filter(c=>!c.ro).length;let loc=null;
    const tn=xn(def.title);
    for(const s of rwsOf(def)){
      /* título exato na própria aba de origem */
      if(s===byName(def.sheet)){
        for(let r=0;r<s.rows.length&&!loc;r++){const row=s.rows[r]||[];if(!row.some(c=>xn(c)===tn))continue;
          for(let h=r+1;h<=r+2&&h<s.rows.length;h++){const m=matchRow(s.rows[h],def);if(m.hits>=Math.min(2,need)&&!claimed[s.name+':'+h]){loc={s,hdr:h,map:m.map};break}}}
      }
      if(loc)break;
    }
    if(!loc&&def.fb!==false){
      const own=[byName(def.sheet),sheets.find(x=>strip(x.name)===tn)].filter(Boolean);
      const pool=own.length?own:sheets,strict=!own.length;
      const GEN=['id','fonte'];
      for(const s of pool){
        for(let r=0;r<s.rows.length;r++){if(claimed[s.name+':'+r])continue;const m=matchRow(s.rows[r],def);
          const spec=Object.keys(m.map).filter(k=>!GEN.includes(k)).length;
          if(strict?(m.hits>=3&&spec>=2&&m.hits>=Math.ceil(need*0.6)):m.hits>=Math.max(2,Math.ceil(need*0.6))){loc={s,hdr:r,map:m.map};break}}
        if(loc)break;
      }
    }
    if(!loc&&!def.matrix){rep.missing.push(def.title);return}
    if(!loc&&def.matrix){/* alocação em matriz */
      for(const s of rwsOf(def)){let hit=null;
        for(let r=0;r<s.rows.length&&!hit;r++){const row=s.rows[r]||[];const els=row.map((c,i)=>/^EL-/i.test(String(c).trim())?i:-1).filter(i=>i>=0);if(els.length>=1)hit={r,els}}
        if(hit){const objs=[];for(let r=hit.r+1;r<s.rows.length;r++){const row=s.rows[r]||[];const fn=String(row[0]||'').trim();if(!/^FN-/i.test(fn))break;hit.els.forEach(ci=>{if(/^(x|1|sim|s|✓|✔|true)/i.test(String(row[ci]==null?'':row[ci]).trim()))objs.push({fn,el:String(s.rows[hit.r][ci]).trim()})})}
          result.push({def,objs});rep.found.push(def.title+' (matriz, '+objs.length+')');claimed[s.name+':'+hit.r]=1;return}
      }
      rep.missing.push(def.title);return;
    }
    claimed[loc.s.name+':'+loc.hdr]=1;
    const objs=[];let warnN={};
    for(let r=loc.hdr+1;r<loc.s.rows.length;r++){
      const row=loc.s.rows[r]||[];
      const mapped=Object.keys(loc.map).map(k=>row[loc.map[k]]);
      if(mapped.every(x=>x===''||x==null||x===undefined))break;
      const o={};
      def.cols.forEach(c=>{
        if(c.ro||loc.map[c.k]===undefined){if(!c.ro)o[c.k]=c.t==='b'?false:c.t==='l'?[]:c.t==='ph'?{}:'';return}
        let v=row[loc.map[c.k]];if(v===undefined||v===null)v='';
        if(c.m){const nn=xn(v);if(nn===''){v=c.def!==undefined?c.def:''}else{const h=c.m.find(x=>xn(x[1])===nn||xn(x[0])===nn);if(h)v=h[0];else{v=c.def!==undefined?c.def:'';warnN[c.h]=(warnN[c.h]||0)+1}}}
        else if(c.t==='b')v=v===true||/^(sim|s|x|true|verdadeiro|1|ok|✓)/i.test(String(v).trim());
        else if(c.t==='l')v=String(v).split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);
        else if(c.t==='ph'){const ob={};String(v).split(/[,;\s]+/).map(x=>x.trim().toUpperCase()).filter(Boolean).forEach(k=>{ob[k]=true});v=ob}
        else if(typeof v==='number')v=String(parseFloat(v.toPrecision(12)));
        else v=String(v).trim();
        o[c.k]=v;
      });
      if(o.id&&/(^|-)EX$|^EX\b/i.test(String(o.id))){rep.skipped++;continue}
      objs.push(o);
    }
    Object.keys(warnN).forEach(k=>rep.warn.push('Coluna "'+k+'" ('+def.title+'): '+warnN[k]+' valor(es) fora da lista, substituído(s) pelo padrão.'));
    result.push({def,objs});rep.found.push(def.title+' ('+objs.length+')');
  });
  return {result,rep};
}
function xlsxApply(result,warn){
  const ns=JSON.parse(JSON.stringify(S));

    ${rep.warn.length?`<p style="margin-top:8px"><b>Avisos:</b></p>${li(rep.warn)}`:''}`,

  addVolta:()=>{const m=$('#vf-mot').value.trim();if(!m){toast('Escreva o motivo da volta.');return}S.voltas.push({de:$('#vf-de').value,para:$('#vf-para').value,motivo:m,data:new Date().toLocaleDateString('pt-BR')});save();render()},
  selReq:el=>{UI.reqSel=el.dataset.id;render()},
  openReq:el=>{UI.reqSel=el.dataset.id;UI.reqFilter='todos';go('requisitos')},
  vcf:el=>{UI.vcFilter=el.dataset.v;render()},
  lcNewLib:el=>{const l=S.licoes[+el.dataset.i];if(!l)return;const b=NEW.libs();b.titulo=short(l.texto,60).replace(/…$/,'');b.descr='';S.libs.push(b);l.destino='biblioteca';l.lib=b.id;save();render();toast('Item '+b.id+' criado. Complete a descrição em Bibliotecas.')},
  csvVc:()=>{const rows=[['ID','Nível','Texto','Método','Critério','Onde','Quando','Responsável','Estado','Evidência'],...S.reqs.map(r=>{const v=S.vcrm[r.id]||{};return [r.id,r.nivel,r.texto,r.metodo,r.criterio,v.onde||'',v.quando||'',v.resp||'',v.status||'planejado',v.evid||'']})];saveFile('ges-wr_vcrm.csv','\ufeff'+csv(rows),'text/csv')},
  rf:el=>{UI.reqFilter=el.dataset.v;render()},
  assist:()=>{UI.assist=!UI.assist;render()},
  assistGo:()=>{const g=id=>($('#'+id).value||'').trim();const i=reqIdx();if(i<0)return;
    const txt=[g('as-suj')||'O robô','deve',g('as-acao'),g('as-crit'),g('as-cond')].filter(Boolean).join(' ').replace(/\s+/g,' ')+'.';S.reqs[i].texto=txt;UI.assist=false;save();render()},
  dicAdd:()=>{const v=$('#dic-new').value.trim();if(!v)return;if(!S.dic.some(w=>norm(w)===norm(v)))S.dic.push(v);save();render()},
  dicDel:el=>{S.dic.splice(+el.dataset.i,1);save();render()},
  dicReset:()=>{S.dic=seed().dic;save();render()},
  csvReq:()=>{const rows=[['ID','Nível','Tipo','Texto','Pai','Fonte','Cenário','Método','Critério','Bloqueios','Alertas'],...S.reqs.map(r=>{const s=reqState(r);return [r.id,r.nivel,r.tipo,r.texto,r.pai,r.fonte,r.cen,r.metodo,r.criterio,s.b,s.a]})];saveFile('requisitos_ges-wr.csv','﻿'+csv(rows))},
  unlink:el=>{const f=S.funcs[+el.dataset.f];f.reqs=f.reqs.filter(r=>r!==el.dataset.r);save();render()},
  selDec:el=>{UI.decSel=el.dataset.id;render()},
  critAdd:el=>{const d=S.decs[+el.dataset.i];d.crit.push({n:'',w:''});d.alts.forEach(a=>a.s.push(''));save();render()},
  critDel:el=>{const d=S.decs[+el.dataset.i],k=+el.dataset.k;if(d.crit.length<2)return;snapshotUndo();d.crit.splice(k,1);d.alts.forEach(a=>a.s.splice(k,1));save();render();toast('Critério removido.',true)},
  altAdd:el=>{const d=S.decs[+el.dataset.i];d.alts.push({n:'',s:d.crit.map(()=>'')});save();render()},
  altDel:el=>{const d=S.decs[+el.dataset.i];snapshotUndo();d.alts.splice(+el.dataset.k,1);save();render();toast('Alternativa removida.',true)},
  decUnreq:el=>{const d=S.decs[+el.dataset.i];d.reqs=d.reqs.filter(r=>r!==el.dataset.r);save();render()},
  aloc:el=>{const key=el.dataset.f+'|'+el.dataset.e;if(S.aloc[key])delete S.aloc[key];else S.aloc[key]=true;save();live()},
  pair:el=>{UI.ifPair={de:el.dataset.de,para:el.dataset.para};render()},
  ifAdd:()=>{const sp=UI.ifPair;if(!sp)return;S.ifs.push({id:nextId('IF',S.ifs),de:sp.de,para:sp.para,tipo:'Potência',descr:'',sinais:'',fonte:''});save();render()},
  otab:el=>{UI.orcTab=el.dataset.v;render()},
  phtog:el=>{const l=S.en.cargas[+el.dataset.i],k=el.dataset.k;l.fases[k]=!l.fases[k];el.setAttribute('aria-pressed',String(!!l.fases[k]));save();live()},
  scen:el=>{const l=S.en.cargas[+el.dataset.i];l.dmode='fases';l.fases=Object.assign({},SCEN[el.dataset.k].fases);save();render()},
  snap:()=>{const M=metrics(),m={};Object.values(M).forEach(x=>{m[x.id]=x.v});S.snapshot={m,data:new Date().toLocaleString('pt-BR'),rot:($('#snap-rot').value||'').trim()};save();render();toast('Estado "antes" salvo.')},
  snapDel:()=>{S.snapshot=null;save();render()},
  copySum:async()=>{const t=resumo();try{await navigator.clipboard.writeText(t);toast('Resumo copiado.')}catch(e){const ov=dlg({title:'Resumo das métricas',body:`<textarea class="ta" rows="12" readonly aria-label="Resumo">${esc(t)}</textarea>`});ov.querySelector('textarea').select()}},
  exportJson:()=>{if(W.ctx.projeto)W.dados[ckey()]=S;saveFile('ges-wr_projetos.json',JSON.stringify(W,null,2))},
  importJson:()=>$('#imp').click(),
  exportXlsx:()=>xlsxExport(),
  importXlsx:()=>$('#impx').click(),
  resetEx:()=>dlg({title:'Restaurar os exemplos do Time B?',body:'<p>Abre Hercules · Crux · 2025 e substitui os dados das temporadas 2025 e 2026 desse projeto pelos exemplos: o de 2025 com as fontes de 2025, o de 2026 com as de 2026. Os outros projetos não mudam.</p>',ok:'Restaurar',onOk:()=>{if(W.ctx.projeto)W.dados[ckey()]=S;W.ctx={programa:'Hercules',projeto:'Crux',temporada:'2025'};W.last.Hercules='Crux';if(!W.projetos.Hercules.includes('Crux'))W.projetos.Hercules.unshift('Crux');if(!W.temporadas.includes('2025'))W.temporadas.unshift('2025');W.dados[SEED_KEY]=seed();W.dados[SEED_KEY26]=seed26();S=W.dados[SEED_KEY];UNDO=null;UI.reqSel=null;UI.decSel=null;UI.ifPair=null;save();renderCtx();render();toast('Exemplos restaurados (2025 e 2026).')}}),
  clearAll:()=>{if(!W.ctx.projeto){toast('Crie um projeto primeiro.');return}dlg({title:'Esvaziar este projeto?',body:`<p>Apaga os dados de ${esc(ctxName())} neste navegador. Os outros projetos não mudam. Salve uma cópia .json antes, se precisar.</p>`,ok:'Esvaziar',onOk:()=>{snapshotUndo();S=blankFor(W.ctx);W.dados[ckey()]=S;UI.reqSel=null;UI.decSel=null;UI.ifPair=null;save();go('enquadramento');toast('Projeto esvaziado.',true)}})},
  menu:()=>{$('#side').classList.toggle('open')}
};
const CHG={
  link:el=>{if(!el.value)return;const f=S.funcs[+el.dataset.f];if(!f.reqs.includes(el.value))f.reqs.push(el.value);save();render()},
  assignFn:el=>{const v=el.value;if(!v)return;const rid=el.dataset.r;
    if(v==='__new'){const f=NEW.funcs();const r=reqById(rid);f.nome=r?short(r.texto,50):'';f.reqs=[rid];S.funcs.push(f)}
    else{const f=S.funcs.find(x=>x.id===v);if(f&&!f.reqs.includes(rid))f.reqs.push(rid)}save();render()},
  decReq:el=>{if(!el.value)return;const d=S.decs[+el.dataset.i];if(!d.reqs.includes(el.value))d.reqs.push(el.value);save();render()}
};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el)}});
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.p||t.type==='checkbox'||t.tagName==='SELECT'||t.dataset.chgonly)return;
  pset(t.dataset.p,t.value);save();live();
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset)return;
  if(t.dataset.chg&&CHG[t.dataset.chg]){CHG[t.dataset.chg](t);return}
  if(!t.dataset.p)return;const p=t.dataset.p;
  if(t.dataset.chgonly&&p.startsWith('reqs.')&&p.endsWith('.id')){
    const i=+p.split('.')[1],old=t.dataset.old,nv=t.value.trim();
    if(nv&&nv!==old&&!S.reqs.some((r,k)=>k!==i&&r.id===nv)){
      S.reqs[i].id=nv;if(S.vcrm[old]){S.vcrm[nv]=S.vcrm[old];delete S.vcrm[old]}S.reqs.forEach(r=>{if(r.pai===old)r.pai=nv});S.funcs.forEach(f=>{f.reqs=f.reqs.map(r=>r===old?nv:r)});S.decs.forEach(d=>{d.reqs=d.reqs.map(r=>r===old?nv:r)});UI.reqSel=nv;
    }else if(nv&&nv!==old){S.reqs[i].id=nv}
    save();render();return;
  }
  if(t.type==='checkbox')pset(p,t.checked);else pset(p,t.value);
  save();
  if(/\.(nivel|tipo|modo|stake|vida)$/.test(p)||p.endsWith('.tipo')||p.startsWith('fontes.')&&p.endsWith('.titulo')){render()}else live();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const ov=$('.ov');if(ov)ov.remove();$('#side').classList.remove('open')}});

/* ---------- painéis de programa, projeto e temporada ---------- */
function setCtx(programa,projeto,temporada){
  if(W.ctx.projeto)W.dados[ckey()]=S;
  W.ctx={programa,projeto:projeto||null,temporada};
  if(projeto)W.last[programa]=projeto;
  S=getData();UNDO=null;UI.reqSel=null;UI.decSel=null;UI.ifPair=null;UI.assist=false;
  save();renderCtx();render();
}
function renderCtx(){
  const c=W.ctx,pj=W.projetos[c.programa]||[];
  const tab=(act,v,on,label)=>`<button type="button" class="ctab" data-act="${act}" data-v="${esc(v)}" aria-pressed="${on}">${esc(label||v)}</button>`;
  const removable=(act,v,label)=>`<button type="button" class="ctab-x" data-act="${act}" data-v="${esc(v)}" aria-label="Remover ${esc(label)}" title="Remover">✕</button>`;
  const addtab=(id,act,ph,lab)=>`<span class="addtab"><input id="${id}" type="text" placeholder="${ph}" aria-label="${lab}" maxlength="40"><button type="button" data-act="${act}" aria-label="${lab}: adicionar" title="Adicionar">+</button></span>`;
  const panel=(titulo,corpo)=>`<div class="cp"><span class="cp-t">${titulo}</span><div class="cp-b">${corpo}</div></div>`;
  $('#ctx').innerHTML=
    panel('Programa',PROGRAMAS.map(p=>tab('ctxProg',p,c.programa===p)).join(''))+
    panel('Projeto',pj.map(p=>`<span class="ctab-w">${tab('ctxProj',p,c.projeto===p)}${(FIXOS[c.programa]||[]).includes(p)?'':removable('ctxDelProj',p,p)}</span>`).join('')+addtab('ctx-new-proj','ctxAddProj','Nome do projeto','Nome do novo projeto'))+
    panel('Temporada',W.temporadas.map(t=>`<span class="ctab-w">${tab('ctxTemp',t,c.temporada===t)}${TEMP_FIXAS.includes(t)?'':removable('ctxDelTemp',t,t)}</span>`).join('')+addtab('ctx-new-temp','ctxAddTemp','Ano','Nova temporada'));
}
const cleanName=v=>String(v||'').replace(/[|]/g,'/').replace(/\s+/g,' ').trim();
Object.assign(ACT,{
  ctxProg:el=>{const p=el.dataset.v;if(p===W.ctx.programa)return;const l=W.last[p],lst=W.projetos[p]||[];setCtx(p,(l&&lst.includes(l))?l:(lst[0]||null),W.ctx.temporada)},
  ctxProj:el=>{if(el.dataset.v!==W.ctx.projeto)setCtx(W.ctx.programa,el.dataset.v,W.ctx.temporada)},
  ctxTemp:el=>{if(el.dataset.v!==W.ctx.temporada)setCtx(W.ctx.programa,W.ctx.projeto,el.dataset.v)},
  ctxAddProj:()=>{const i=$('#ctx-new-proj'),n=cleanName(i.value);if(!n){i.focus();return}
    const lst=W.projetos[W.ctx.programa];if(lst.some(x=>norm(x)===norm(n))){toast('Já existe um projeto com esse nome em '+W.ctx.programa+'.');return}
    lst.push(n);setCtx(W.ctx.programa,n,W.ctx.temporada);toast('Projeto "'+n+'" criado em '+W.ctx.programa+'.')},
  ctxAddTemp:()=>{const i=$('#ctx-new-temp'),n=cleanName(i.value);if(!n){i.focus();return}
    if(W.temporadas.some(x=>norm(x)===norm(n))){toast('Essa temporada já existe.');return}
    W.temporadas.push(n);setCtx(W.ctx.programa,W.ctx.projeto,n);toast('Temporada '+n+' criada.')},
  ctxDelProj:el=>{const n=el.dataset.v,prog=W.ctx.programa;dlg({title:'Remover o projeto "'+n+'"?',body:'<p>Apaga os dados do projeto em todas as temporadas, neste navegador. Salve uma cópia .json antes, se precisar.</p>',ok:'Remover',onOk:()=>{
    if(W.ctx.projeto)W.dados[ckey()]=S;
    Object.keys(W.dados).forEach(k=>{if(k.startsWith(prog+'|'+n+'|'))delete W.dados[k]});
    W.projetos[prog]=W.projetos[prog].filter(x=>x!==n);if(W.last[prog]===n)delete W.last[prog];
    const nx=(W.ctx.projeto===n)?(W.projetos[prog][0]||null):W.ctx.projeto;
    W.ctx={programa:prog,projeto:nx,temporada:W.ctx.temporada};S=getData();UNDO=null;UI.reqSel=null;UI.decSel=null;UI.ifPair=null;save();renderCtx();render()}})},
  ctxDelTemp:el=>{const t=el.dataset.v;dlg({title:'Remover a temporada '+t+'?',body:'<p>Apaga os dados dessa temporada em todos os projetos, neste navegador. Salve uma cópia .json antes, se precisar.</p>',ok:'Remover',onOk:()=>{
    if(W.ctx.projeto)W.dados[ckey()]=S;
    Object.keys(W.dados).forEach(k=>{if(k.endsWith('|'+t))delete W.dados[k]});
    W.temporadas=W.temporadas.filter(x=>x!==t);
    const nt=(W.ctx.temporada===t)?(W.temporadas[0]||'2025'):W.ctx.temporada;
    if(!W.temporadas.length)W.temporadas=TEMP_FIXAS.slice();
    W.ctx={programa:W.ctx.programa,projeto:W.ctx.projeto,temporada:nt};S=getData();UNDO=null;UI.reqSel=null;UI.decSel=null;UI.ifPair=null;save();renderCtx();render()}})}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ctx-new-proj'){e.preventDefault();ACT.ctxAddProj()}if(e.key==='Enter'&&e.target.id==='ctx-new-temp'){e.preventDefault();ACT.ctxAddTemp()}});

function boot(){
  const h=location.hash.replace('#','');if(VIEWS[h])UI.mod=h;
  $('#side').setAttribute('data-live','side');$('#topinfo').setAttribute('data-live','top');
  $('#imp').addEventListener('change',ev=>{
    const f=ev.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);
      if(o&&o.v===2&&o.ctx&&o.dados){W=o;S=getData();UNDO=null;UI.reqSel=null;UI.decSel=null;UI.ifPair=null;save();renderCtx();render();toast('Projetos importados.')}
      else if(o&&o.v===1&&Array.isArray(o.reqs)){if(!W.ctx.projeto)throw new Error('Crie ou selecione um projeto antes de importar este arquivo.');snapshotUndo();S=fixS(o);W.dados[ckey()]=S;save();render();toast('Importado para '+ctxName()+'.',true)}
      else throw new Error('Arquivo não é um projeto GES-WR.')}catch(err){toast('Importação falhou: '+err.message)}};
    r.readAsText(f);ev.target.value='';
  });
  $('#impx').addEventListener('change',ev=>{
    const f=ev.target.files[0];if(!f)return;
    f.arrayBuffer().then(buf=>xlsxImportBuf(buf,f.name)).catch(err=>toast('Importação falhou: '+err.message));
    ev.target.value='';
  });
  renderCtx();
  render();
}
boot();


</script>
